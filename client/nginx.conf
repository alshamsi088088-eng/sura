map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name sura-codex.com www.sura-codex.com;
  return 301 https://sura-codex.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name sura-codex.com;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # Gzip compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_proxied any;
  gzip_vary on;
  gzip_disable "msie6";

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # No caching for API
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location /socket.io/ {
    proxy_pass http://server:5000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # No caching for WebSocket
    add_header Cache-Control "no-store" always;
  }

  # Static assets with content hash — long cache
  location /assets/ {
    root /usr/share/nginx/html;
    expires 365d;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    access_log off;
    try_files $uri =404;
  }

  # Public files
  location /logo.svg {
    root /usr/share/nginx/html;
    expires 365d;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    access_log off;
  }

  location /hero-night.png {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
  }

  location /manifest.json {
    root /usr/share/nginx/html;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location /sw.js {
    root /usr/share/nginx/html;
    expires 0;
    add_header Cache-Control "no-cache" always;
  }

  # HTML / SPA — no cache
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
}

