    <!-- Preload critical fonts (swap-display prevents invisible text) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" as="style" />

    <!-- Optimized font loading with display=swap to avoid FOIT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

<link rel="icon" href="/favicon.ico" sizes="48x48" />

    <title>Sura Codex</title>

    <!-- Google Analytics (GA4) — Deferred with requestIdleCallback -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W3FEHS40P3', { send_page_view: false, anonymize_ip: true });
      
      // Defer analytics load until idle
      const loadGA = () => {
        const script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-W3FEHS40P3';
        script.async = true;
        document.head.appendChild(script);
        // Send initial pageview after GA loads
        script.onload = () => { gtag('event', 'page_view'); };
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGA, { timeout: 2000 });
      } else {
        setTimeout(loadGA, 1000);
      }
    </script>

  <body class="bg-sura-dark text-sura-ivory transition-colors duration-300">
